[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seomind"
version = "0.5.0"
description = "Local-first autonomous AI SEO assistant for Google Search Console"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohammad Reza Esmail Gol" }]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.5,<3.0",
  "httpx>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "defusedxml>=0.7,<1.0",
  "pystray>=0.19,<1.0; platform_system == 'Windows'",
  "Pillow>=10,<13; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1.0",
]

[project.scripts]
seomind = "seomind.cli:main"
seomind-tray = "seomind.tray:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
